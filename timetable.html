<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SU Planner – Semester times</title>
  <meta name="description" content="See each semester of your 4-year plan on a weekly timetable and pick sections that don't clash.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/timetable.css">
</head>
<body class="times-page">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="4" rx="1"/><path d="M8.5 5H6.5a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 17.5 5h-2"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9.5L12 5l10 4.5L12 14z"/><path d="M6 11.5V16c3.5 2.5 8.5 2.5 12 0v-4.5M22 9.5v5"/></symbol>
  </svg>

  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" type="button" aria-label="Show or hide the side panel" aria-controls="sidebar">
      <svg class="i"><use href="#i-menu"/></svg>
    </button>
    <h1 class="brand">SU Planner</h1>
    <nav class="page-tabs" aria-label="Pages">
      <a href="index.html"><span class="long">Weekly schedule</span><span class="short">Week</span></a>
      <a href="plan.html"><span class="long">4-year plan</span><span class="short">Plan</span></a>
      <a href="timetable.html" aria-current="page"><span class="long">Semester times</span><span class="short">Times</span></a>
      <a href="prereq.html"><span class="long">Prerequisites</span><span class="short">Prereqs</span></a>
      <a href="help.html"><span class="long">How to use</span><span class="short">Help</span></a>
    </nav>
    <div class="actions">
      <button id="copy-btn" class="action" type="button" title="Copy this semester's CRNs"><svg class="i"><use href="#i-copy"/></svg><span class="label">Copy CRNs</span></button>
    </div>
  </header>

  <aside id="sidebar" aria-label="Semesters">
    <label class="program-row" title="Your program">
      <svg class="i"><use href="#i-cap"/></svg>
      <select id="program" class="program-select" aria-label="Your program"></select>
    </label>
    <label id="entry-row" class="entry-row" title="Your degree requirements depend on the year you started">
      <span>Year you started</span>
      <select id="entry" class="entry-select" aria-label="Year you started"></select>
    </label>
    <div id="extras" class="extras-box" hidden></div>

    <div class="side-scroll">
      <div class="side-label">Semesters in your plan</div>
      <div id="sem-list" class="sem-list" role="tablist" aria-label="Semesters"></div>
      <div class="side-label">Sections <small>of the timetable shown</small></div>
      <div id="picks" class="picks"></div>
    </div>
  </aside>

  <main id="main">
    <section class="tt-top">
      <div id="tt-head" class="tt-head"></div>
      <div id="tt-notes" class="tt-notes"></div>
    </section>
    <div class="tt-wrap">
      <table id="tt-grid" class="tt-grid" aria-label="Weekly timetable for the selected semester"></table>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data/courses.js"></script>
  <script src="data/schedule-202602.js"></script>
  <script src="data/requirements.js"></script>
  <script src="js/programs.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/times.js"></script>
  <script src="js/timetable.js"></script>
</body>
</html>
